<!doctype html>
<html lang="pt-BR">
  <head>
    <style>
      /* ===== base ===== */
      :root {
        --largura: 320px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        position: relative;
        overflow-x: hidden;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 16px;
        font-family: var(--vscode-font-family);
        color: var(--vscode-foreground);
      }

      /* os dois grupos: ratinho e informações */
      .lado-rato,
      .lado-info {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: 100%;
        max-width: var(--largura);
      }

      /* ===== balão ===== */
      .balao {
        margin: 0;
        width: 100%;
        border: 1.5px solid #3b4261;
        border-radius: 14px;
        padding: 8px 12px;
        text-align: center;
        overflow-wrap: anywhere;
      }
      body.desconfiado .balao {
        border-color: #e0af68;
      }
      body.bravo .balao {
        border-color: #f7768e;
      }
      body.festa .balao {
        border-color: #bb9af7;
      }
      .trecho {
        display: block;
        margin-top: 6px;
        padding: 4px 8px;
        border-radius: 6px;
        background: #1a1b26;
        font-family: var(--vscode-editor-font-family);
        font-size: 12px;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .trecho[hidden] {
        display: none;
      }

      /* ===== ratinho ===== */
      svg.rato {
        width: clamp(110px, 55vw, 200px);
        height: auto;
        overflow: visible;
      }
      .anima {
        transform-box: view-box;
      }
      .bigode {
        transform-origin: 100px 116px;
        animation: bigode 2.6s ease-in-out infinite;
      }
      .olhos {
        transform-origin: 100px 100px;
        animation: piscar 4.5s infinite;
      }
      .colher {
        transform-origin: 112px 186px;
        animation: mexer 1.6s ease-in-out infinite;
      }
      .vapor path {
        opacity: 0;
        animation: vapor 2.4s ease-in-out infinite;
      }
      .vapor path:nth-child(2) {
        animation-delay: 0.8s;
      }
      .vapor path:nth-child(3) {
        animation-delay: 1.6s;
      }
      .interroga {
        transform-origin: 166px 36px;
        animation: quica 1.2s ease-in-out infinite;
      }
      .pe {
        transform-origin: 108px 214px;
      }

      /* troca de cara: cada humor mostra só as suas partes */
      .so-desconfiado,
      .so-bravo,
      .so-festa {
        display: none;
      }
      body.desconfiado .so-desconfiado {
        display: inline;
      }
      body.bravo .so-bravo {
        display: inline;
      }
      body.festa .so-festa {
        display: inline;
      }
      body.desconfiado .so-feliz,
      body.bravo .so-feliz,
      body.festa .so-feliz {
        display: none;
      }
      body.desconfiado .colher,
      body.bravo .colher,
      body.festa .colher {
        animation: none;
      }
      body.bravo .pe {
        animation: bate 0.45s ease-in-out infinite;
      }
      body.festa svg.rato {
        animation: pula 0.6s ease-in-out infinite;
      }

      /* ===== pomodoro ===== */
      .pomodoro {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        border: 1px solid #3b4261;
        border-radius: 12px;
        padding: 10px 12px;
      }
      .pomodoro-topo {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .anel {
        width: clamp(38px, 14vw, 48px);
        height: auto;
        aspect-ratio: 1;
        flex-shrink: 0;
        transform: rotate(-90deg);
      }
      .trilho {
        fill: none;
        stroke: #3b4261;
        stroke-width: 6;
      }
      .progresso {
        fill: none;
        stroke: #f7768e;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 175.9;
        stroke-dashoffset: 175.9;
        transition: stroke-dashoffset 1s linear;
      }
      .pomodoro.pausado .progresso {
        stroke: #565f89;
      }
      .tempo {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        min-width: 0;
      }
      .tempo b {
        font-size: clamp(18px, 7vw, 24px);
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .tempo small {
        opacity: 0.75;
        overflow-wrap: anywhere;
      }
      .tomates {
        font-size: 15px;
        white-space: nowrap;
      }

      /* botões */
      .botoes {
        display: flex;
        gap: 6px;
      }
      .botoes button {
        flex: 1;
        min-width: 0;
        border: 0;
        border-radius: 8px;
        padding: 7px 10px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
      }
      .botoes button:hover {
        background: var(--vscode-button-hoverBackground);
      }
      .botoes button.secundario {
        background: var(--vscode-button-secondaryBackground);
        color: var(--vscode-button-secondaryForeground);
      }
      .botoes button.secundario:hover {
        background: var(--vscode-button-secondaryHoverBackground);
      }
      .botoes button:focus-visible {
        outline: 2px solid var(--vscode-focusBorder);
        outline-offset: 2px;
      }

      /* ===== contadores: 3 caixinhas lado a lado ===== */
      .placar {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        width: 100%;
      }
      .placar div {
        border: 1px solid #3b4261;
        border-radius: 10px;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .placar b {
        font-size: 18px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .placar small {
        opacity: 0.75;
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .placar .tomatadas b {
        color: #f7768e;
      }
      .barra {
        width: 100%;
        height: 6px;
        border-radius: 99px;
        background: #9ece6a;
        overflow: hidden;
        display: flex;
        justify-content: flex-end;
      }
      .barra span {
        display: block;
        height: 100%;
        width: 0%;
        background: #e0af68;
        transition: width 0.4s ease;
      }

      /* ===== efeitos ===== */
      .confete {
        position: absolute;
        top: -12px;
        width: 7px;
        height: 11px;
        border-radius: 2px;
        pointer-events: none;
        animation: cai 1.8s linear forwards;
      }
      .tomate {
        position: fixed;
        width: 26px;
        height: 26px;
        translate: -50% -50%;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 35%,
          #ff9a9a,
          #e5484d 55%,
          #a8232a
        );
        pointer-events: none;
        z-index: 10;
        animation: voa 0.55s ease-in forwards;
      }
      .tomate::before {
        content: "";
        position: absolute;
        top: -3px;
        left: 9px;
        width: 9px;
        height: 6px;
        border-radius: 50% 50% 0 0;
        background: #73a942;
      }
      .splat {
        position: fixed;
        width: clamp(80px, 38vw, 130px);
        aspect-ratio: 1;
        translate: -50% -50%;
        pointer-events: none;
        z-index: 9;
        opacity: 0.9;
        animation: gruda 0.7s ease-out forwards;
      }
      .splat svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .splat.limpando {
        animation: limpa 0.7s ease-in forwards;
      }

      /* ===== RESPONSIVIDADE ===== */

      /* barra lateral larga: blocos um pouco maiores */
      @media (min-width: 420px) {
        :root {
          --largura: 360px;
        }
      }

      /* estreita: os contadores viram lista (nome na esquerda, número na direita) */
      @media (max-width: 280px) {
        .placar {
          grid-template-columns: 1fr;
          gap: 4px;
        }
        .placar div {
          flex-direction: row-reverse;
          justify-content: space-between;
          align-items: baseline;
          gap: 8px;
          padding: 5px 10px;
        }
        .placar b {
          font-size: 16px;
        }
        .placar small {
          font-size: 12px;
        }
      }

      /* bem estreita: tudo mais compacto */
      @media (max-width: 200px) {
        body {
          padding: 10px;
          gap: 10px;
        }
        .lado-rato,
        .lado-info {
          gap: 10px;
        }
        .balao {
          padding: 6px 8px;
          font-size: 12px;
        }
        .pomodoro {
          padding: 8px;
        }
        .pomodoro-topo {
          flex-wrap: wrap;
          gap: 8px;
        }
        .botoes {
          flex-direction: column;
        }
      }

      /* baixa (pouca altura): ratinho menor pra caber tudo */
      @media (max-height: 420px) {
        svg.rato {
          width: clamp(90px, 30vw, 140px);
        }
        .lado-rato,
        .lado-info {
          gap: 10px;
        }
      }

      /* larga e baixa (painel de baixo, junto do terminal): lado a lado */
      @media (min-width: 520px) and (max-height: 480px) {
        body {
          flex-direction: row;
          align-items: center;
          justify-content: center;
          gap: 28px;
          padding: 12px 20px;
        }
        .lado-rato {
          max-width: 240px;
        }
        .lado-info {
          max-width: 340px;
        }
        svg.rato {
          width: clamp(90px, 18vw, 150px);
        }
      }

      /* ===== animações ===== */
      @keyframes bigode {
        50% {
          transform: rotate(3deg);
        }
      }
      @keyframes piscar {
        0%,
        92%,
        100% {
          transform: scaleY(1);
        }
        95% {
          transform: scaleY(0.1);
        }
      }
      @keyframes mexer {
        0%,
        100% {
          transform: rotate(-10deg);
        }
        50% {
          transform: rotate(12deg);
        }
      }
      @keyframes vapor {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        40% {
          opacity: 0.55;
        }
        100% {
          opacity: 0;
          transform: translateY(-14px);
        }
      }
      @keyframes quica {
        0%,
        100% {
          transform: translateY(0) rotate(-6deg);
        }
        50% {
          transform: translateY(-6px) rotate(6deg);
        }
      }
      @keyframes bate {
        0%,
        100% {
          transform: rotate(0);
        }
        50% {
          transform: rotate(-14deg);
        }
      }
      @keyframes pula {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-14px);
        }
      }
      @keyframes cai {
        to {
          transform: translateY(520px) rotate(540deg);
          opacity: 0;
        }
      }
      @keyframes voa {
        from {
          transform: translate(0, 0) scale(0.5) rotate(0);
        }
        to {
          transform: translate(var(--dx), var(--dy)) scale(3.2) rotate(200deg);
        }
      }
      @keyframes gruda {
        0% {
          transform: scale(0.3);
        }
        40% {
          transform: scale(1.12);
        }
        60% {
          transform: scale(1);
        }
        100% {
          transform: scale(1) translateY(10px);
        }
      }
      @keyframes limpa {
        from {
          transform: translateY(10px);
          opacity: 0.9;
        }
        to {
          transform: translateY(80px);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
        .confete,
        .tomate {
          display: none;
        }
      }
    </style>
  </head>

    <script>
      // o "telefone" pra falar com a extensão
      const vscode = acquireVsCodeApi();
      const fala = document.getElementById("fala");
      const trecho = document.getElementById("trecho");
      const bIniciar = document.getElementById("b-iniciar");
      const bReiniciar = document.getElementById("b-reiniciar");
      const VOLTA = 175.9; // tamanho do contorno do anel
      const MAX_SPLATS = 14; // no máximo 14 manchas na tela
      let rodandoAgora = false; // o pomodoro está rodando?

      // os botões mandam recado pra extensão
      bIniciar.addEventListener("click", () => {
        vscode.postMessage({ tipo: rodandoAgora ? "pausar" : "iniciar" });
      });
      bReiniciar.addEventListener("click", () => {
        vscode.postMessage({ tipo: "reiniciar" });
      });

      // o desenho da mancha de tomate (o tamanho vem do CSS)
      const DESENHO_SPLAT = `
      <svg viewBox="0 0 120 120">
        <path fill="#e5484d" d="M60 14c9 0 11 12 19 14s18-6 22 3-7 14-4 22 14 12 9 21-16 2-21 9 2 20-8 23-12-9-20-9-13 12-22 6 1-17-5-23-19-2-21-12 11-12 11-20S14 36 20 29s16 3 23-1 8-14 17-14z"/>
        <path fill="#e5484d" d="M50 94c0 10 3 22 7 22s5-9 5-20z"/>
        <path fill="#e5484d" d="M78 88c0 7 2 14 5 14s4-6 3-14z"/>
        <circle cx="44" cy="42" r="8" fill="#ff9a9a" opacity=".6"/>
        <ellipse cx="70" cy="64" rx="2.5" ry="4" fill="#f7d774"/>
        <ellipse cx="56" cy="72" rx="2.5" ry="4" fill="#f7d774"/>
        <ellipse cx="66" cy="50" rx="2.2" ry="3.5" fill="#f7d774"/>
      </svg>`;

      // escuta os recados da extensão
      window.addEventListener("message", (evento) => {
        const recado = evento.data;

        if (recado.tipo === "humor") {
          document.body.className = recado.humor;
          fala.textContent = recado.fala;
          trecho.textContent = recado.codigo || "";
          trecho.hidden = !recado.codigo;
          if (recado.humor === "festa") soltarConfete();
          if (recado.tomates) jogarTomates(recado.tomates);
          // feliz ou em festa? limpa as manchas
          if (recado.humor === "feliz" || recado.humor === "festa")
            limparSplats();
        }

        // redesenha as manchas que já estavam (quando o painel recarrega)
        if (recado.tipo === "splats") {
          for (let i = 0; i < recado.quantidade; i++)
            criarSplat(lugarAleatorio());
        }

        if (recado.tipo === "placar") {
          document.getElementById("n-digitado").textContent =
            recado.digitados.toLocaleString("pt-BR");
          document.getElementById("n-colado").textContent =
            recado.colados.toLocaleString("pt-BR");
          document.getElementById("n-tomatadas").textContent =
            recado.tomatadas.toLocaleString("pt-BR");
          document.getElementById("barra-colado").style.width =
            recado.porcentagem + "%";
        }

        if (recado.tipo === "tempo") {
          const minutos = String(Math.floor(recado.segundos / 60)).padStart(
            2,
            "0",
          );
          const segundos = String(recado.segundos % 60).padStart(2, "0");
          document.getElementById("relogio").textContent =
            minutos + ":" + segundos;

          const feito = recado.segundos / recado.meta;
          document.getElementById("progresso").style.strokeDashoffset =
            VOLTA * (1 - feito);

          document.getElementById("tomates").textContent =
            "🏆 " + recado.pomodoros;
          document.getElementById("rotulo-tempo").textContent = recado.motivo;
          document
            .getElementById("pomodoro")
            .classList.toggle("pausado", recado.pausado);

          // o botão mostra Iniciar ou Pausar
          rodandoAgora = recado.rodando;
          bIniciar.textContent = recado.rodando ? "⏸ Pausar" : "▶ Iniciar";
        }
      });

      // um ponto aleatório da tela
      function lugarAleatorio() {
        return {
          x: window.innerWidth * (0.15 + Math.random() * 0.7),
          y: window.innerHeight * (0.1 + Math.random() * 0.6),
        };
      }

      // joga vários tomates, um depois do outro
      function jogarTomates(quantidade) {
        const semAnimacao = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        for (let i = 0; i < quantidade; i++) {
          if (semAnimacao) criarSplat(lugarAleatorio());
          else setTimeout(jogarUmTomate, i * 380);
        }
      }

      // um tomate sai da mão do ratinho e faz splat na tela
      function jogarUmTomate() {
        const rato = document.querySelector("svg.rato").getBoundingClientRect();
        const saidaX = rato.left + rato.width * 0.67;
        const saidaY = rato.top + rato.height * 0.6;
        const alvo = lugarAleatorio();

        const tomate = document.createElement("span");
        tomate.className = "tomate";
        tomate.style.left = saidaX + "px";
        tomate.style.top = saidaY + "px";
        tomate.style.setProperty("--dx", alvo.x - saidaX + "px");
        tomate.style.setProperty("--dy", alvo.y - saidaY + "px");
        document.body.appendChild(tomate);

        tomate.addEventListener("animationend", () => {
          tomate.remove();
          criarSplat(alvo);
        });
      }

      // cria uma mancha que fica grudada
      function criarSplat(lugar) {
        const splat = document.createElement("div");
        splat.className = "splat";
        splat.innerHTML = DESENHO_SPLAT;
        splat.style.left = lugar.x + "px";
        splat.style.top = lugar.y + "px";
        splat.style.rotate = Math.random() * 360 + "deg";
        document.body.appendChild(splat);

        // passou do limite? tira a mais antiga
        const todas = document.querySelectorAll(".splat:not(.limpando)");
        if (todas.length > MAX_SPLATS) todas[0].remove();
      }

      // as manchas escorrem pra baixo e somem
      function limparSplats() {
        document
          .querySelectorAll(".splat:not(.limpando)")
          .forEach((splat, i) => {
            setTimeout(() => {
              splat.classList.add("limpando");
              splat.addEventListener("animationend", () => splat.remove());
            }, i * 80);
          });
      }

      // joga confete colorido
      function soltarConfete() {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches)
          return;
        const cores = [
          "#bb9af7",
          "#7aa2f7",
          "#9ece6a",
          "#e0af68",
          "#f7768e",
          "#7dcfff",
        ];
        for (let i = 0; i < 24; i++) {
          const papel = document.createElement("span");
          papel.className = "confete";
          papel.style.left = Math.random() * 100 + "%";
          papel.style.background = cores[i % cores.length];
          papel.style.animationDelay = Math.random() * 1.2 + "s";
          document.body.appendChild(papel);
          setTimeout(() => papel.remove(), 3500);
        }
      }

      // avisa a extensão que o painel carregou
      vscode.postMessage({ tipo: "pronto" });
    </script>
  </body>
</html>
