<!doctype html>
<html lang="pt-BR">
  <head>
    <style>
      body {
        position: relative;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 16px;
        font-family: var(--vscode-font-family);
        color: var(--vscode-foreground);
      }
      .balao {
        margin: 0;
        border: 1.5px solid #3b4261;
        border-radius: 14px;
        padding: 8px 12px;
        text-align: center;
      }
      body.desconfiado .balao {
        border-color: #e0af68;
      }
      body.bravo .balao {
        border-color: #f7768e;
      }
      body.festa .balao {
        border-color: #bb9af7;
      }
      svg.rato {
        width: 180px;
        overflow: visible;
      }
      .anima {
        transform-box: view-box;
      }
      .bigode {
        transform-origin: 100px 116px;
        animation: bigode 2.6s ease-in-out infinite;
      }
      .olhos {
        transform-origin: 100px 100px;
        animation: piscar 4.5s infinite;
      }
      .colher {
        transform-origin: 112px 186px;
        animation: mexer 1.6s ease-in-out infinite;
      }
      .vapor path {
        opacity: 0;
        animation: vapor 2.4s ease-in-out infinite;
      }
      .vapor path:nth-child(2) {
        animation-delay: 0.8s;
      }
      .vapor path:nth-child(3) {
        animation-delay: 1.6s;
      }
      .interroga {
        transform-origin: 166px 36px;
        animation: quica 1.2s ease-in-out infinite;
      }
      .pe {
        transform-origin: 108px 214px;
      }

      /* troca de cara: cada humor mostra só as suas partes */
      .so-desconfiado,
      .so-bravo,
      .so-festa {
        display: none;
      }
      body.desconfiado .so-desconfiado {
        display: inline;
      }
      body.bravo .so-bravo {
        display: inline;
      }
      body.festa .so-festa {
        display: inline;
      }
      body.desconfiado .so-feliz,
      body.bravo .so-feliz,
      body.festa .so-feliz {
        display: none;
      }
      body.desconfiado .colher,
      body.bravo .colher,
      body.festa .colher {
        animation: none;
      }
      body.bravo .pe {
        animation: bate 0.45s ease-in-out infinite;
      }
      body.festa svg.rato {
        animation: pula 0.6s ease-in-out infinite;
      }

      /* pomodoro */
      .pomodoro {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        max-width: 260px;
        border: 1px solid #3b4261;
        border-radius: 12px;
        padding: 8px 12px;
        box-sizing: border-box;
      }
      .anel {
        width: 48px;
        height: 48px;
        flex-shrink: 0;
        transform: rotate(-90deg);
      }
      .trilho {
        fill: none;
        stroke: #3b4261;
        stroke-width: 6;
      }
      .progresso {
        fill: none;
        stroke: #f7768e;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 175.9;
        stroke-dashoffset: 175.9;
        transition: stroke-dashoffset 1s linear;
      }
      .pomodoro.pausado .progresso {
        stroke: #565f89;
      }
      .tempo {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }
      .tempo b {
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .tempo small {
        opacity: 0.75;
      }
      .tomates {
        font-size: 15px;
        white-space: nowrap;
      }

      /* contadores */
      .placar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        width: 100%;
        max-width: 260px;
      }
      .placar div {
        border: 1px solid #3b4261;
        border-radius: 10px;
        padding: 6px 10px;
        display: flex;
        flex-direction: column;
      }
      .placar b {
        font-size: 20px;
        font-variant-numeric: tabular-nums;
      }
      .placar small {
        opacity: 0.75;
      }
      .barra {
        width: 100%;
        max-width: 260px;
        height: 6px;
        border-radius: 99px;
        background: #9ece6a;
        overflow: hidden;
        display: flex;
        justify-content: flex-end;
      }
      .barra span {
        display: block;
        height: 100%;
        width: 0%;
        background: #e0af68;
        transition: width 0.4s ease;
      }

      /* confete */
      .confete {
        position: absolute;
        top: -12px;
        width: 7px;
        height: 11px;
        border-radius: 2px;
        pointer-events: none;
        animation: cai 1.8s linear forwards;
      }

      /* NOVO: tomate voando */
      .tomate {
        position: fixed;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 35%,
          #ff9a9a,
          #e5484d 55%,
          #a8232a
        );
        pointer-events: none;
        z-index: 10;
        animation: voa 0.55s ease-in forwards;
      }
      .tomate::before {
        content: "";
        position: absolute;
        top: -3px;
        left: 9px;
        width: 9px;
        height: 6px;
        border-radius: 50% 50% 0 0;
        background: #73a942;
      }
      /* NOVO: splat no vidro */
      .splat {
        position: fixed;
        width: 130px;
        height: 130px;
        margin: -65px 0 0 -65px;
        pointer-events: none;
        z-index: 9;
        animation: escorre 3s ease-in forwards;
      }

      @keyframes bigode {
        50% {
          transform: rotate(3deg);
        }
      }
      @keyframes piscar {
        0%,
        92%,
        100% {
          transform: scaleY(1);
        }
        95% {
          transform: scaleY(0.1);
        }
      }
      @keyframes mexer {
        0%,
        100% {
          transform: rotate(-10deg);
        }
        50% {
          transform: rotate(12deg);
        }
      }
      @keyframes vapor {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        40% {
          opacity: 0.55;
        }
        100% {
          opacity: 0;
          transform: translateY(-14px);
        }
      }
      @keyframes quica {
        0%,
        100% {
          transform: translateY(0) rotate(-6deg);
        }
        50% {
          transform: translateY(-6px) rotate(6deg);
        }
      }
      @keyframes bate {
        0%,
        100% {
          transform: rotate(0);
        }
        50% {
          transform: rotate(-14deg);
        }
      }
      @keyframes pula {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-14px);
        }
      }
      @keyframes cai {
        to {
          transform: translateY(520px) rotate(540deg);
          opacity: 0;
        }
      }
      @keyframes voa {
        from {
          transform: translate(0, 0) scale(0.5) rotate(0);
        }
        to {
          transform: translate(var(--dx), var(--dy)) scale(3.2) rotate(200deg);
        }
      }
      @keyframes escorre {
        0% {
          transform: scale(0.3);
        }
        10% {
          transform: scale(1.12);
        }
        16% {
          transform: scale(1);
        }
        70% {
          opacity: 1;
          transform: translateY(8px);
        }
        100% {
          opacity: 0;
          transform: translateY(30px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
        .confete,
        .tomate,
        .splat {
          display: none;
        }
      }
    </style>
  </head>

    <script>
      // o "telefone" pra falar com a extensão
      const vscode = acquireVsCodeApi();
      const balao = document.querySelector(".balao");
      const VOLTA = 175.9; // tamanho do contorno do anel

      // NOVO: o desenho da mancha de tomate
      const DESENHO_SPLAT = `
      <svg viewBox="0 0 120 120" width="130" height="130">
        <path fill="#e5484d" d="M60 14c9 0 11 12 19 14s18-6 22 3-7 14-4 22 14 12 9 21-16 2-21 9 2 20-8 23-12-9-20-9-13 12-22 6 1-17-5-23-19-2-21-12 11-12 11-20S14 36 20 29s16 3 23-1 8-14 17-14z"/>
        <path fill="#e5484d" d="M50 94c0 10 3 22 7 22s5-9 5-20z"/>
        <path fill="#e5484d" d="M78 88c0 7 2 14 5 14s4-6 3-14z"/>
        <circle cx="44" cy="42" r="8" fill="#ff9a9a" opacity=".6"/>
        <ellipse cx="70" cy="64" rx="2.5" ry="4" fill="#f7d774"/>
        <ellipse cx="56" cy="72" rx="2.5" ry="4" fill="#f7d774"/>
        <ellipse cx="66" cy="50" rx="2.2" ry="3.5" fill="#f7d774"/>
      </svg>`;

      // escuta os recados da extensão
      window.addEventListener("message", (evento) => {
        const recado = evento.data;

        if (recado.tipo === "humor") {
          document.body.className = recado.humor;
          balao.textContent = recado.fala;
          if (recado.humor === "festa") soltarConfete();
          if (recado.tomates) jogarTomates(recado.tomates); // NOVO
        }

        if (recado.tipo === "placar") {
          document.getElementById("n-digitado").textContent =
            recado.digitados.toLocaleString("pt-BR");
          document.getElementById("n-colado").textContent =
            recado.colados.toLocaleString("pt-BR");
          document.getElementById("barra-colado").style.width =
            recado.porcentagem + "%";
        }

        if (recado.tipo === "tempo") {
          const minutos = String(Math.floor(recado.segundos / 60)).padStart(
            2,
            "0",
          );
          const segundos = String(recado.segundos % 60).padStart(2, "0");
          document.getElementById("relogio").textContent =
            minutos + ":" + segundos;

          const feito = recado.segundos / recado.meta;
          document.getElementById("progresso").style.strokeDashoffset =
            VOLTA * (1 - feito);

          document.getElementById("tomates").textContent =
            "🍅 " + recado.pomodoros;
          document.getElementById("rotulo-tempo").textContent = recado.motivo;
          document
            .getElementById("pomodoro")
            .classList.toggle("pausado", recado.pausado);
        }
      });

      // NOVO: joga vários tomates, um depois do outro
      function jogarTomates(quantidade) {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches)
          return;
        for (let i = 0; i < quantidade; i++) {
          setTimeout(jogarUmTomate, i * 380);
        }
      }

      // NOVO: um tomate sai da mão do ratinho e faz splat na tela
      function jogarUmTomate() {
        // onde está o ratinho na tela
        const rato = document.querySelector("svg.rato").getBoundingClientRect();
        const saidaX = rato.left + rato.width * 0.67;
        const saidaY = rato.top + rato.height * 0.6;

        // um lugar aleatório pra acertar
        const alvoX = window.innerWidth * (0.2 + Math.random() * 0.6);
        const alvoY = window.innerHeight * (0.15 + Math.random() * 0.5);

        // cria o tomate na mão do ratinho
        const tomate = document.createElement("span");
        tomate.className = "tomate";
        tomate.style.left = saidaX + "px";
        tomate.style.top = saidaY + "px";
        tomate.style.setProperty("--dx", alvoX - saidaX + "px");
        tomate.style.setProperty("--dy", alvoY - saidaY + "px");
        document.body.appendChild(tomate);

        // quando o tomate chega: some e vira splat
        tomate.addEventListener("animationend", () => {
          tomate.remove();

          const splat = document.createElement("div");
          splat.className = "splat";
          splat.innerHTML = DESENHO_SPLAT;
          splat.style.left = alvoX + "px";
          splat.style.top = alvoY + "px";
          splat.style.rotate = Math.random() * 360 + "deg";
          document.body.appendChild(splat);

          setTimeout(() => splat.remove(), 3000);
        });
      }

      // joga confete colorido
      function soltarConfete() {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches)
          return;
        const cores = [
          "#bb9af7",
          "#7aa2f7",
          "#9ece6a",
          "#e0af68",
          "#f7768e",
          "#7dcfff",
        ];
        for (let i = 0; i < 24; i++) {
          const papel = document.createElement("span");
          papel.className = "confete";
          papel.style.left = Math.random() * 100 + "%";
          papel.style.background = cores[i % cores.length];
          papel.style.animationDelay = Math.random() * 1.2 + "s";
          document.body.appendChild(papel);
          setTimeout(() => papel.remove(), 3500);
        }
      }

      // avisa a extensão que o painel carregou
      vscode.postMessage({ tipo: "pronto" });
    </script>
